name: CI

# Routine CI does not download model weights or datasets.
# Cached Qwen evaluation is the manual workflow in model-validation.yml.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU PyTorch
        run: python -m pip install --upgrade pip && python -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src tests research_tests scripts && ruff format --check src tests research_tests scripts
      - name: Tests
        run: pytest tests research_tests
      - name: Smoke
        run: python scripts/smoke_test.py
